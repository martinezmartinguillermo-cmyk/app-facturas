 <button onclick="serAdd()">+ Nueva serie</button><label>Serie para rectificativas<select onchange="S.cfg.sRect=this.value;save()">${c.series.map(s=>`<option value=${s.id} ${c.sRect==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`}
function serSet(id,k,v){const s=S.cfg.series.find(x=>x.id==id);if(k=='n')s.n=Math.max(1,Math.round(num(v)));else if(k=='w')s.w=Math.min(8,Math.max(1,Math.round(num(v))));else s[k]=String(v).trim();
 if(k!='name'&&S.inv.some(i=>i.num==s.p+String(s.n).padStart(s.w,'0')))msg('Ese número ya existe: se usará el siguiente libre');save();render()}
function serAdd(){S.cfg.series.push({id:uid(),name:'Nueva serie',p:'B-'+T.slice(0,4)+'-',n:1,w:4});save();render()}
function serDel(id){const c=S.cfg;c.series=c.series.filter(x=>x.id!=id);if(c.sLast==id)c.sLast=defSer();save();render()}
function fix(){const c=S.cfg,O=x=>x&&typeof x=='object'&&!Array.isArray(x),A=x=>Array.isArray(x)?x.filter(O):[],D8=d=>typeof d=='string'&&/^\d{4}-\d\d-\d\d/.test(d);
 if(!O(c.tpl))c.tpl={};if(!O(c.veh))c.veh={};const v=c.veh;if(!FU[v.fuel])v.fuel='die';if(!O(v.p))v.p={};if(!O(v.c))v.c={};c.series=A(c.series);c.irpf=+c.irpf||0;
 KEYS.slice(1).forEach(k=>{S[k]=A(S[k]);S[k].forEach(x=>{if(!x.id)x.id=uid()})});
 S.cl.forEach(x=>{x.name=String(x.name??'')});
 S.inv.forEach(i=>{i.num=String(i.num??'');if(!D8(i.date))i.date=T;if(!D8(i.due))i.due=i.date;i.lines=A(i.lines);i.lines.forEach(l=>{l.t=String(l.t??'');l.q=+l.q||0;l.p=Math.round(+l.p||0);l.d=+l.d||0;l.iva=+l.iva||0});i.sup=A(i.sup);i.sup.forEach(x=>{x.t=String(x.t??'');x.c=Math.round(+x.c||0)});i.paid=Math.round(+i.paid||0);i.irpf=+i.irpf||0;if(!O(i.snap))i.snap={name:''};if(!O(i.em))i.em={}});
 S.ex.forEach(e=>{e.t=String(e.t??'');if(!D8(e.date))e.date=T;e.b=Math.round(+e.b||0);e.iva=+(e.iva??21)||0;e.d=+(e.d??100)||0});
 S.rt.forEach(r=>{r.km=+r.km||0})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&hoy()!=T){T=hoy();rr()}});
const sure=(k,t)=>{if(ASK==k){ASK='';return true}ASK=k;msg(t+' Pulsa otra vez para confirmar.');setTimeout(()=>{if(ASK==k)ASK=''},6000);return false};
function editInv(id){const i=S.inv.find(x=>x.id==id);D=JSON.parse(JSON.stringify({cl:i.cl,date:i.date,ivaOn:i.ivaOn,irpfOn:i.irpfOn,irpf:i.irpf,lines:i.lines,sup:i.sup,notes:i.notes||'',sv:i.sv||{m:'n',a:'',b:''},ser:'',editId:i.id,num:i.num}));if(!S.cl.some(c=>c.id==D.cl))D.cl='';render();scrollTo(0,0)}
function saveEdit(c){const o=S.inv.find(x=>x.id==D.editId);if(!o)return msg('No encuentro la factura');
 S.ex.forEach(e=>{if(e.billed==o.id&&!D.sup.some(s=>s.eid==e.id))e.billed=null});D.sup.forEach(s=>{const e=S.ex.find(x=>x.id==s.eid);if(e)e.billed=o.id});
 const nn=(D.num||'').trim()||o.num;if(nn!=o.num)bumpSer(nn);Object.assign(o,{num:nn,date:D.date,due:addDays(D.date,tp(o.tpl).days),cl:D.cl,snap:{name:c.name,alias:c.alias||'',nif:c.nif,addr:c.addr||'',cp:c.cp||'',mun:c.mun||'',city:c.city||'',email:c.email||''},em:emitter(),sv:D.sv,lines:D.lines,ivaOn:D.ivaOn,irpfOn:D.irpfOn,irpf:D.irpf,sup:D.sup,notes:D.notes});
 const t=calc(o).total;if(o.paid>t)o.paid=Math.max(0,t);o.pd=o.paid>=t?(o.pd||T):null;save();SEL=o.id;D=null;render();scrollTo(0,0);msg('Factura '+o.num+' actualizada')}
function delInv(id){const i=S.inv.find(x=>x.id==id);if(!sure('di'+id,'¿Borrar la factura '+i.num+'?'))return;
 S.ex.forEach(e=>{if(e.billed==id)e.billed=null});if(i.rect){const o=S.inv.find(x=>x.id==i.of);if(o)o.voided=false}S.inv.forEach(x=>{if(x.of==id)x.of=null});S.inv=S.inv.filter(x=>x.id!=id);
 const se=S.cfg.series.find(x=>i.num==x.p+String(x.n-1).padStart(x.w,'0'));if(se)se.n--;save();SEL=null;render();msg(se?'Factura borrada: la serie vuelve a '+i.num:'Factura borrada. Ojo: deja un hueco en la numeración')}
const loadJs=u=>new Promise((ok,ko)=>{if(window.html2pdf)return ok();const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>ko(new Error('sin conexión'));document.head.appendChild(e)});
async function pdf(id){const i=S.inv.find(x=>x.id==id),fn=(i.num+' '+cn(i)).replace(/[\\/:*?"<>|]+/g,'-').slice(0,90)+'.pdf';msg('Generando PDF…');
 try{await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');const r=document.documentElement,pv=r.dataset.theme;let b;r.dataset.theme='light';
  try{b=await html2pdf().set({margin:8,html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4'}}).from($('#pdoc')).outputPdf('blob')}finally{if(pv)r.dataset.theme=pv;else delete r.dataset.theme}
  const d=await claude.use('downloads');if(!d)throw new Error('descargas no disponibles');await d.save({filename:fn,data:b});msg('PDF guardado en tu dispositivo')}catch(e){msg('No se pudo crear el PDF ('+(e&&e.message||e)+'). Usa Imprimir › Guardar como PDF')}}
function bumpSer(nn){S.cfg.series.forEach(s=>{if(s.p&&nn.startsWith(s.p)){const k=+nn.slice(s.p.length);if(Number.isInteger(k)&&k>=s.n)s.n=k+1}})}
const useNum=(id,nn)=>{if(!nn||nn==takeNum(id,1))return takeNum(id);bumpSer(nn);return nn};
const svTxt=i=>{const s=i.sv;if(!s||s.m=='n'||!s.a)return'';return s.m=='r'&&s.b&&s.b!=s.a?'del '+fd(s.a)+' al '+fd(s.b):fd(s.a)};
function hRes(){const r=resCalc(R.t,R.p,S.cfg.basis),row=(a,b,k)=>`<div class="row ${k||''}"><span>${a}</span><b>${eur(b)}</b></div>`;
 return `<button onclick="go('mas')">‹ Más</button><h2>Resultados</h2><div class=seg><button class="${R.t=='m'?'on':''}" onclick="R.t='m';render()">Mensual</button><button class="${R.t=='a'?'on':''}" onclick="R.t='a';render()">Anual</button></div><br>
 ${R.t=='m'?`<input type=month aria-label="Mes" value="${R.p.slice(0,7)}" onchange="R.p=this.value||R.p;render()">`:`<input type=number inputmode=numeric aria-label="Año" value="${R.p.slice(0,4)}" onchange="R.p=(this.value||R.p.slice(0,4))+'-01';render()">`}
 <small>Criterio: ${S.cfg.basis=='dev'?'fecha de factura':'cobros y pagos'} (cámbialo en Más › Mis datos)</small>
 <div class=card>${row('Ingresos (sin IVA ni suplidos)',r.ing)}${row('Gastos deducibles',r.gas)}${row('Beneficio',r.ben,r.ben<0?'bad':'ok')}</div>
 <div class=card>${row('IVA repercutido',r.rep)}${row('IVA soportado deducible',r.sop)}${row('IVA a ingresar (estimado)',r.rep-r.sop)}${row('IRPF retenido por clientes (pago a cuenta)',r.ret)}</div>
 <p><small>Estimación orientativa, no es una presentación oficial.</small></p>`}
fix();render();
