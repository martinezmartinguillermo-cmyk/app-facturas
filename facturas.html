function phPick(f){if(!f)return;if(f.type=='application/pdf'){const r=new FileReader();r.onload=()=>{if(r.result.length>190000)return msg('El PDF es demasiado grande (máximo unos 140 KB). Haz una foto del ticket.');PH=r.result;$('#ePv').innerHTML='<small>📄 '+esc(f.name)+' listo. Se guardará al pulsar Guardar.</small>'};r.readAsDataURL(f);return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let u='';for(const w of [1100,800,600]){const k=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.72);if(u.length<200000)break}PH=u;$('#ePv').innerHTML='<img src="'+u+'" alt="Ticket" style="max-height:120px;border-radius:8px;margin:4px 0 8px"><br><small>Se guardará al pulsar Guardar.</small>'};im.src=r.result};r.readAsDataURL(f)}

async function phView(id){let u=null;try{if(DB){const x=await DB.doc('ph_'+id).get();u=x.exists?x.data().v:null}else u=localStorage.getItem('ph_'+id)}catch(e){}if(!u)return msg('No se encuentra el archivo');if(u.startsWith('data:application/pdf')){const b=new Blob([Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0))],{type:'application/pdf'});return dl('ticket-'+id+'.pdf',b)}const o=document.createElement('div');o.className='ov';o.onclick=()=>o.remove();o.innerHTML='<img src="'+u+'" alt="Ticket del gasto">';document.body.appendChild(o)}
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hIn=i=>[i.em&&i.em.nif||'',i.num,i.date,calc(i).total,i.hp||''].join('|');
async function chain(i){try{const pv=S.inv.filter(x=>x.h&&x.id!=i.id).sort((a,b)=>ord(b)-ord(a))[0];i.hp=pv?pv.h:'';i.h=await sha(hIn(i));save()}catch(e){}}
async function verChain(){const L=S.inv.filter(x=>x.h);if(!L.length)return msg('Aún no hay facturas con huella');const bad=[];for(const i of L)if(await sha(hIn(i))!=i.h)bad.push(i.num);msg(bad.length?'Modificadas después de emitir: '+bad.join(', '):'Las '+L.length+' huellas son correctas')}
function hTri(){const ys=[...new Set([T.slice(0,4),...S.inv.map(i=>i.date.slice(0,4))])].sort().reverse(),r=triC(TY,TQ),row=(a,b,k)=>`<div class="row${k?'':' '}"${k?' style="font-weight:700;border-top:1px solid var(--bd);padding-top:8px"':''}><span>${a}</span><span>${b}</span></div>`,PL=['1 al 20 de abril','1 al 20 de julio','1 al 20 de octubre','1 al 30 de enero'];
 return `<button onclick="go('mas')">‹ Más</button><h2>Impuestos trimestrales</h2><div class=ps><select class=mini aria-label="Año" onchange="TY=this.value;render()">${ys.map(y=>`<option ${y==TY?'selected':''}>${y}</option>`).join('')}</select>${[1,2,3,4].map(q=>`<button class="pill ${q==TQ?'on':''}" onclick="TQ=${q};render()">T${q}</button>`).join('')}</div>
 <div class=card><div class=ch><b>Modelo 303 · IVA</b><small>T${TQ} ${TY}</small></div>${row('IVA repercutido (tus facturas)',eur(r.rep))}${row('IVA soportado deducible (gastos)','−'+eur(r.sop))}${row(r.r303>=0?'Resultado a ingresar':'Resultado a compensar',eur(Math.abs(r.r303)),1)}</div>
 <div class=card><div class=ch><b>Modelo 130 · IRPF</b><small>1 ene – fin T${TQ}</small></div>${row('Ingresos acumulados',eur(r.ing))}${row('Gastos deducibles acumulados','−'+eur(r.gas))}${row('Rendimiento neto',eur(r.ren))}${row('20 % del rendimiento',eur(r.frac))}${row('Retenciones de tus clientes','−'+eur(r.ret))}${row('Pagos de trimestres anteriores','−'+eur(r.prev))}${row('Resultado a ingresar',eur(r.p130),1)}${r.pr>=70?`<p><small>El ${r.pr} % de tus ingresos lleva retención: si el año anterior también superaste el 70 %, puede que no tengas que presentar el 130. Confírmalo con tu gestor.</small></p>`:''}</div>
 <div class="card al"><b>Para apartar este trimestre: ${eur(Math.max(0,r.r303)+r.p130)}</b><br><small>Plazo de presentación: del ${PL[TQ-1]}.</small></div><p><small>Cálculo orientativo, sin suplidos ni casos especiales (prorrata, recargo de equivalencia, gastos de difícil justificación…). Revísalo con tu gestor antes de presentar.</small></p>`}
function triC(y,q){const inQ=d=>d.slice(0,4)==y&&Math.ceil(+d.slice(5,7)/3)==q,toQ=d=>d.slice(0,4)==y&&Math.ceil(+d.slice(5,7)/3)<=q;let rep=0,sop=0,ing=0,gas=0,ret=0,cr=0;
 for(const i of S.inv){const c=calc(i);if(inQ(i.date))rep+=c.iva;if(toQ(i.date)){ing+=c.base;ret+=c.irpf;if(c.irpf)cr+=c.base}}
 for(const e of S.ex){if(e.sup)continue;const cu=rd(e.b*e.iva/100);if(inQ(e.date))sop+=rd(cu*e.d/100);if(toQ(e.date))gas+=rd(e.b*e.d/100)}
 const ren=ing-gas,frac=Math.max(0,rd(ren*.2));let prev=0;for(let k=1;k<q;k++)prev+=triC(y,k).p130;
 return{rep,sop,r303:rep-sop,ing,gas,ren,frac,ret,prev,p130:Math.max(0,frac-ret-prev),pr:ing>0?Math.round(cr/ing*100):0}}
let LI=new Set();const lateInv=()=>S.inv.filter(i=>!i.rect&&!i.voided&&!i.sent&&addDays(i.date,7)<=T&&!S.ag.some(b=>b.inv==i.id));
const late=()=>S.ag.filter(b=>{const e=new Date((b.end||b.date)+'T12:00:00');e.setDate(e.getDate()+7);if(e.toISOString().slice(0,10)>T)return false;const i=invd(b)&&S.inv.find(x=>x.id==b.inv);return !i||!i.sent});
function navB(){const fi=document.querySelector('nav button[data-v="inv"]');if(fi){const n2=lateInv().length;let e2=fi.querySelector('.nb');if(n2){if(!e2){e2=document.createElement('span');e2.className='nb';fi.appendChild(e2)}e2.textContent=n2}else if(e2)e2.remove()}const b=document.querySelector('nav button[data-v="ag"]');if(!b)return;const n=late().length;let e=b.querySelector('.nb');if(n){if(!e){e=document.createElement('span');e.className='nb';b.appendChild(e)}e.textContent=n;b.setAttribute('aria-label','Agenda, '+n+' avisos')}else{if(e)e.remove();b.removeAttribute('aria-label')}}
function tgSent(id){const i=S.inv.find(x=>x.id==id);i.sent=i.sent?'':T;save();render();msg(i.sent?'Marcada como enviada':'Marcada como no enviada')}
const SCOL={ok:'#16a34a',wa:'#f59e0b',bad:'#dc2626',mu:'var(--bd)'};
function resCh(){const y=R.p.slice(0,4),M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],d=M.map((_,k)=>resCalc('m',y+'-'+String(k+1).padStart(2,'0'),S.cfg.basis)),mx=nm(Math.max(...d.map(x=>Math.max(x.ing,x.gas,x.ben)))),Y=v=>140-Math.max(0,v)/mx*125,sel=R.t=='m'?+R.p.slice(5,7)-1:-1,pts=[];
 let g='';for(let k=0;k<=4;k++){const yy=Y(mx*k/4);g+=`<line x1="36" x2="338" y1="${yy}" y2="${yy}" style="stroke:var(--bd)"/><text x="30" y="${yy+3}" text-anchor="end" style="fill:var(--mu);font-size:9px">${ax(mx*k/4)}</text>`}
 d.forEach((x,k)=>{const x0=38+k*25;g+=`<g opacity="${sel<0||sel==k?1:.3}"><rect x="${x0+2}" y="${Y(x.ing)}" width="9" height="${140-Y(x.ing)}" rx="2" style="fill:var(--c1)"/><rect x="${x0+12}" y="${Y(x.gas)}" width="9" height="${140-Y(x.gas)}" rx="2" style="fill:var(--c3)"/></g><text x="${x0+12}" y="156" text-anchor="middle" style="fill:var(--mu);font-size:9px;font-weight:${sel==k?700:400}">${M[k]}</text>`;pts.push([x0+12,Y(x.ben)])});
 g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--c4)" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" style="fill:var(--c4)"/>`).join('');
 return `<div class=card><div class=ch><b>Evolución de ${y}</b></div><svg viewBox="0 0 340 162" width="100%" role="img" aria-label="Ingresos, gastos y beneficio por mes de ${y}">${g}</svg><small><span style="color:var(--c1)">■</span> Ingresos &nbsp;<span style="color:var(--c3)">■</span> Gastos &nbsp;<span style="color:var(--c4)">●</span> Beneficio${sel>=0?' · resaltado: '+M[sel]:''}</small></div>`}
function resBars(r){const L=[['Ingresos',r.ing,'--c1'],['Gastos',r.gas,'--c3'],['Beneficio',r.ben,'--c4'],['IVA a ingresar',r.rep-r.sop,'--ac'],['IRPF retenido',r.ret,'--c5']],mx=Math.max(1,...L.map(x=>Math.abs(x[1])));
 return `<div class=card><div class=ch><b>Resumen del periodo</b></div>${L.map(x=>`<div style="margin:10px 0"><div class=row style="margin:0 0 4px"><span>${x[0]}</span><b>${eur(x[1])}</b></div><div style="height:10px;border-radius:5px;background:var(--in)"><div style="height:10px;border-radius:5px;width:${Math.max(0,x[1])/mx*100}%;background:var(${x[2]})"></div></div></div>`).join('')}</div>`}
function hRes(){const r=resCalc(R.t,R.p,S.cfg.basis),row=(a,b,k)=>`<div class="row ${k||''}"><span>${a}</span><b>${eur(b)}</b></div>`;
 return `<button onclick="go('mas')">‹ Más</button><h2>Resultados</h2><div class=seg><button class="${R.t=='m'?'on':''}" onclick="R.t='m';render()">Mensual</button><button class="${R.t=='a'?'on':''}" onclick="R.t='a';render()">Anual</button></div><br>
 ${R.t=='m'?`<input type=month aria-label="Mes" value="${R.p.slice(0,7)}" onchange="R.p=this.value||R.p;render()">`:`<input type=number inputmode=numeric aria-label="Año" value="${R.p.slice(0,4)}" onchange="R.p=(this.value||R.p.slice(0,4))+'-01';render()">`}
 <small>Criterio: ${S.cfg.basis=='dev'?'fecha de factura':'cobros y pagos'} (cámbialo en Más › Mis datos)</small>
 ${resCh()}${resBars(r)}<div class=card>${row('Ingresos (sin IVA ni suplidos)',r.ing)}${row('Gastos deducibles',r.gas)}${row('Beneficio',r.ben,r.ben<0?'bad':'ok')}</div>
 <div class=card>${row('IVA repercutido',r.rep)}${row('IVA soportado deducible',r.sop)}${row('IVA a ingresar (estimado)',r.rep-r.sop)}${row('IRPF retenido por clientes (pago a cuenta)',r.ret)}</div>
 <p><small>Estimación orientativa, no es una presentación oficial.</small></p>`}
fix();render();
</script></body></html>
