let TI=-1;
function tourStart(k){TI=k||0;tourShow()}
function tourEnd(){const o=$('#tour');if(o)o.remove();TI=-1;tReset();if(!S.cfg.tourDone){S.cfg.tourDone=1;save()}go('home')}
function tourMenu(){const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target==o)o.remove()};const C=[...new Set(TOUR.map(x=>x.c))];
 o.innerHTML=`<div class=card style="width:100%;max-width:440px;max-height:92vh;overflow:auto"><div class=ch><b>🎓 Guía de la app</b><button onclick="this.closest('.ov').remove()" aria-label="Cerrar">✕</button></div><button class=pri style="width:100%;margin-bottom:12px" onclick="this.closest('.ov').remove();tourStart(0)">▶ Ver la guía completa (${TOUR.length} pasos)</button><small>O empieza por un capítulo:</small>${C.map(c=>{const k=TOUR.findIndex(x=>x.c==c),n=TOUR.filter(x=>x.c==c).length;return `<button class="tb sm" style="width:100%;margin:8px 0 0" onclick="this.closest('.ov').remove();tourStart(${k})"><i>${ico('help')}</i><span style="text-align:left"><b>${c}</b><br><small>${n} paso${n>1?'s':''}</small></span></button>`}).join('')}</div>`;document.body.appendChild(o)}
function tourShow(){const st=TOUR[TI];if(!st)return tourEnd();try{st.go()}catch(e){}scrollTo(0,0);setTimeout(()=>{let o=$('#tour');if(!o){o=document.createElement('div');o.id='tour';document.body.appendChild(o)}
 const sel=typeof st.sel=='function'?st.sel():st.sel;let el=sel&&document.querySelector(sel);if(el&&st.hl=='card')el=el.closest('.card')||el;if(el&&st.hl=='parent')el=el.parentElement||el;let hl='',pos='top:50%;transform:translateY(-50%)';
 if(el){el.scrollIntoView({block:'center'});const r=el.getBoundingClientRect(),pad=6,hh=Math.min(r.height+pad*2,innerHeight*.45);hl=`<div class=thl style="left:${Math.max(4,r.left-pad)}px;top:${r.top-pad}px;width:${Math.min(innerWidth-8,r.width+pad*2)}px;height:${hh}px"></div>`;pos=r.top+hh/2<innerHeight/2?`top:${Math.min(r.top+hh+14,innerHeight-300)}px`:`bottom:${Math.max(12,innerHeight-r.top+14)}px`}else hl='<div class=tbg></div>';
 const cs=TOUR.filter(x=>x.c==st.c),ci=cs.indexOf(st)+1;
 o.innerHTML=`${hl}<div class=ttip style="${pos}"><div class=row style="margin:0 0 6px"><small><b>${st.c}</b> · ${ci}/${cs.length}</small><small>${TI+1} de ${TOUR.length}</small></div><div style="height:4px;border-radius:2px;background:var(--in);margin-bottom:10px"><div style="height:4px;border-radius:2px;width:${(TI+1)/TOUR.length*100}%;background:var(--ac)"></div></div><h3 style="margin:0 0 6px;text-transform:none;letter-spacing:0;font-size:18px;color:var(--tx)">${st.t}</h3><p style="margin:0 0 14px;line-height:1.5">${st.d}</p><div class=row style="margin:0"><button onclick="tourEnd()" style="margin:0">Salir</button><span>${TI?'<button onclick="TI--;tourShow()" style="margin:0 6px 0 0">‹ Anterior</button>':''}<button class=pri onclick="TI++;tourShow()" style="margin:0">${TI==TOUR.length-1?'Terminar':'Siguiente ›'}</button></span></div></div>`;const tp=o.querySelector('.ttip'),tr=tp.getBoundingClientRect();if(tr.bottom>innerHeight-8||tr.top<8){tp.style.transform='none';tp.style.bottom='auto';tp.style.top=Math.max(8,Math.min(tr.top,innerHeight-tr.height-8))+'px'}},150)}

const pinK=()=>'fx_pin:'+(FBUSR&&FBUSR.uid||'local'),pinOn=()=>!!localStorage.getItem(pinK());
let LOCKED=false,LBG=0,PINF=0,PINW=0,JUSTIN=false;
const pinHash=async p=>sha('palmadapp|'+(FBUSR&&FBUSR.uid||'local')+'|'+p);
function lockH(){if(!LOCKED||!pinOn())return '';const w=PINW>Date.now();return `<div style="max-width:360px;margin:12vh auto 0;text-align:center;padding:0 10px"><div style="font-size:48px">🔒</div><h1 style="font-size:26px;margin:14px 0 4px">Palmadapp</h1><p class=mu>Introduce tu código para entrar</p><input id=pinIn type=password inputmode=numeric autocomplete=off maxlength=8 style="text-align:center;font-size:24px;letter-spacing:8px;margin:16px 0" ${w?'disabled':''} onkeydown="if(event.key=='Enter')pinTry()"><button class=gbtn onclick="pinTry()" ${w?'disabled':''}>${w?'Demasiados intentos: espera 30 s':'Desbloquear'}</button><button style="margin-top:22px;font-size:12px" onclick="pinForgot()">He olvidado el código</button></div>`}
async function pinTry(){const v=($('#pinIn')||{}).value||'';if(PINW>Date.now())return;if(await pinHash(v)==localStorage.getItem(pinK())){LOCKED=false;PINF=0;render()}else{PINF++;if(PINF>=5){PINF=0;PINW=Date.now()+30000;setTimeout(render,30100)}msg('Código incorrecto');render();const e=$('#pinIn');if(e)e.focus()}}
function pinForgot(){if(!sure('pf','Para quitar el código tienes que volver a entrar con tu cuenta de Google.'))return;localStorage.removeItem(pinK());LOCKED=false;if(FBA)FBA.signOut();else render()}
let PINCH=0;async function pinSet(){const a=($('#pn1')||{}).value||'',b=($('#pn2')||{}).value||'';if(!/^\d{4,8}$/.test(a))return msg('El código debe tener de 4 a 8 números');if(b!==a)return msg('Los códigos no coinciden');PINCH=0;localStorage.setItem(pinK(),await pinHash(a));msg('Código de bloqueo activado en este dispositivo');render()}
function pinOff(){if(!sure('po','¿Quitar el código de bloqueo de este dispositivo?'))return;localStorage.removeItem(pinK());render();msg('Código de bloqueo quitado')}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden')LBG=Date.now();else if(pinOn()&&LBG&&Date.now()-LBG>(S.cfg.lockMin||5)*60000){LOCKED=true;render()}});
function wipeOut(){if(!sure('wo','Se cerrará tu sesión y se borrarán TUS datos de este dispositivo (siguen guardados en tu nube). ¿Seguir?'))return;const u=FBUSR&&FBUSR.uid;try{if(u){localStorage.removeItem('fx2:'+u);localStorage.removeItem(pinK());const U=fxUsers().filter(x=>x.uid!=u);localStorage.setItem('fx_users',JSON.stringify(U));if(localStorage.getItem('fx2_owner')==u){localStorage.removeItem('fx2');localStorage.removeItem('fx2_owner')}}localStorage.removeItem('logo');for(const k of Object.keys(localStorage))if(k.startsWith('ph_'))localStorage.removeItem(k)}catch(e){}LSK='fx2:out';if(FBA)FBA.signOut();else location.reload()}
function hSec(){const on=pinOn(),ext_=(u,t)=>`<button class="tb sm" style="width:100%;margin:6px 0 0" onclick="ext('${u}')"><i>${ico('web')}</i>${t}</button>`;
 return `<button onclick="go('mas')">‹ Más</button><h2>Seguridad</h2>
 <div class=card><b>🔒 Código de bloqueo</b><p class=mu style="margin:6px 0 10px">Pide un código al abrir la app y al volver a ella tras unos minutos. Sirve por si alguien coge tu móvil o usas un ordenador compartido.</p>${on?`<div class=row><span class="bd ok">✓ Activado en este dispositivo</span></div><label>Bloquear al volver tras<select onchange="S.cfg.lockMin=+this.value;save()">${[1,5,15,60].map(m=>`<option value=${m} ${(S.cfg.lockMin||5)==m?'selected':''}>${m} minuto${m>1?'s':''}</option>`).join('')}</select></label><div class=row style="justify-content:flex-start;gap:6px"><button onclick="LOCKED=true;render()">Bloquear ahora</button><button onclick="PINCH=1;render()">Cambiar código</button><button onclick="pinOff()" style="color:var(--bad)">Quitar</button></div>`:`<input id=pn1 type=password inputmode=numeric autocomplete=new-password maxlength=8 placeholder="Nuevo código (4 a 8 números)"><input id=pn2 type=password inputmode=numeric autocomplete=new-password maxlength=8 placeholder="Repite el código"><button class=pri onclick="pinSet()">Activar código de bloqueo</button>`}${on&&PINCH?`<input id=pn1 type=password inputmode=numeric autocomplete=new-password maxlength=8 placeholder="Nuevo código (4 a 8 números)"><input id=pn2 type=password inputmode=numeric autocomplete=new-password maxlength=8 placeholder="Repite el código"><div class=row style="justify-content:flex-start;gap:6px"><button class=pri onclick="pinSet()">Guardar código nuevo</button><button onclick="PINCH=0;render()">Cancelar</button></div>`:''}</div>
 <div class=card><b>🛡️ Cómo están protegidos tus datos</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.55"><li>Se guardan en tu nube privada de Google (Firebase), <b>cifrados</b> en el envío y en el almacenamiento.</li><li>Las reglas de la base de datos solo dejan leer y escribir a <b>tu cuenta de Google</b>; ningún otro usuario de la app puede verlos.</li><li>La app solo se conecta a servicios autorizados (Google, mapas y la librería del PDF) y comprueba que esa librería no ha sido alterada.</li><li>No hay contraseñas propias que puedan robarse: entras con Google.</li></ul></div>
 <div class=card><b>✅ Lo que más te protege (depende de ti)</b><ol style="margin:8px 0 0;padding-left:18px;line-height:1.55"><li>Activa la <b>verificación en dos pasos</b> en tu cuenta de Google. Es la llave de tus datos.</li><li>Actívala también en <b>GitHub</b>, porque ahí está el programa de la app.</li><li>Guarda las <b>copias de seguridad</b> en un sitio privado; contienen todos tus datos.</li><li>En un dispositivo que no sea tuyo, usa <b>Cerrar sesión y borrar datos</b>.</li></ol>${ext_('https://myaccount.google.com/signinoptions/two-step-verification','Verificación en dos pasos de Google')}${ext_('https://github.com/settings/security','Seguridad de GitHub (2FA)')}</div>
 <div class=card><b>📱 Este dispositivo</b><p class=mu style="margin:6px 0 10px">Si has usado la app en un móvil u ordenador que no es tuyo, cierra sesión y borra la copia local. Tus datos siguen en tu nube.</p><button onclick="wipeOut()" style="color:var(--bad)">Cerrar sesión y borrar datos de este dispositivo</button></div>`}

 return `<button onclick="go('mas')">‹ Más</button><h2>Resultados</h2><div class=seg><button class="${R.t=='m'?'on':''}" onclick="R.t='m';render()">Mensual</button><button class="${R.t=='a'?'on':''}" onclick="R.t='a';render()">Anual</button></div><br>
 ${R.t=='m'?`<input type=month aria-label="Mes" value="${R.p.slice(0,7)}" onchange="R.p=this.value||R.p;render()">`:`<input type=number inputmode=numeric aria-label="Año" value="${R.p.slice(0,4)}" onchange="R.p=(this.value||R.p.slice(0,4))+'-01';render()">`}
 <small>Criterio: ${S.cfg.basis=='dev'?'fecha de factura':'cobros y pagos'} (cámbialo en Más › Mis datos)</small>
